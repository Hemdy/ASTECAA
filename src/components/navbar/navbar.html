<header class="nav" [class.scrolled]="scrolled()" [class.open]="open()">
  <div class="nav-bar container">
    <a routerLink="/" class="brand" (click)="close()">
      <span class="brand-mark">A</span>
      <span class="brand-text">
        <span class="brand-name">ASTECAA</span>
        <span class="brand-sub">est. 1998</span>
      </span>
    </a>

    <button
      class="nav-toggle"
      (click)="open.set(!open())"
      [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
      aria-controls="primary-nav"
    >
      <span [class.x]="open()"></span>
      <span [class.x]="open()"></span>
      <span [class.x]="open()"></span>
    </button>


    <nav class="nav-links" id="primary-nav" [class.show]="open()">
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          (click)="close()"
          >{{ item.label }}</a
        >
      }
      @if (auth.loading()) {
        <span class="nav-auth-placeholder"></span>
      } @else if (auth.isAuthenticated()) {
        <span class="nav-greeting">Hi, {{ auth.displayName().split(' ')[0] }}</span>
        <button class="btn btn-outline btn-sm nav-signout" (click)="signOut()">Sign out</button>
      } @else {
        <a routerLink="/login" (click)="close()" class="nav-signin">Sign in</a>
        <a routerLink="/register" (click)="close()" class="btn btn-gold btn-sm nav-cta">Register</a>
      }
    </nav>
  
  </div>
</header>
