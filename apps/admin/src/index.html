<!doctype html>
<html lang="en">
  <head>
    <title>ASTECAA Admin</title>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e6" />
    <script>
      try {
        var saved = localStorage.getItem('astec_admin_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (saved === 'light' || saved === 'dark') {
          var cs = document.querySelector('meta[name="color-scheme"]');
          if (cs) cs.setAttribute('content', saved);
        }
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', theme === 'dark' ? '#1c1612' : '#f6f1e6');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/jpg" sizes="32x32" href="/images/ASTECAA.jpg" />
    <script src="/api-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Modern Typography & Remix Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css"
    />
  </head>

</html>
